<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />
    <title>CoWork</title>
    <meta name="description" content="AI-powered real-time collaborative workspace. Your team thinks here." />

    <!-- Fonts: Geist (UI), Instrument Serif (display), Geist Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved/system theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mural_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Razorpay's official checkout SDK — must load before Pricing.jsx's
         "Pay ₹99 & Upgrade to Pro" button is clicked, since it sets the
         global window.Razorpay that button relies on. Loaded here (not
         dynamically injected) so it's available as early as possible and
         doesn't race the app's own JS bundle. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
